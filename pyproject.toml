[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rigbys-feed"
version = "0.1.0"
description = "Phase 1 public federal grants feed builder"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "fastmcp>=2.14,<3",
    "httpx>=0.28,<0.29",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pgserver==0.1.4"]

[project.scripts]
rigbys-feed = "rigbys_feed.cli:main"
rigbys-mcp = "rigbys_mcp.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rigbys_feed", "src/rigbys_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "rigbys_feed/migrations"
